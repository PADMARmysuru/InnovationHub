<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register · Innovation Hub</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..900&family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body>
<main class="narrow wide">
<div class="box"><h1 id="ttl">Create profile</h1>
<p id="hint">Already registered on Digital Design Explorer? <a href="login.html">Log in with that account</a> instead. You will only be asked for your class details.</p>
<form id="f"><div class="formgrid">
<label>Full name<input id="fullname" required maxlength="80" autocomplete="name"></label>
<label>USN<input id="usn" required placeholder="4GWxxECxxx" pattern="4[Gg][Ww][0-9]{2}[Ee][Cc][0-9]{3}" title="Format 4GWxxECxxx"></label>
<label>Semester<select id="sem" required><option value="">Select</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select></label>
<label>Section<input id="sec" required maxlength="1" placeholder="A" pattern="[A-Za-z]"></label>
<label class="acct">Email<input id="email" type="email" autocomplete="email"></label>
<label class="acct">Branch<input value="ECE" disabled></label>
<label class="acct">Password<input id="p" type="password" minlength="6" autocomplete="new-password"></label>
<label class="acct">Confirm password<input id="q2" type="password" minlength="6" autocomplete="new-password"></label>
</div><p class="small">Your semester and section decide which classmates you can team up with. They cannot be changed while you are in a team.</p>
<button class="btn" id="go">Create account</button></form>
<div class="msg" id="m" hidden></div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/hub.js"></script>
<script>
let user=null;
(async()=>{
  user=await renderShell("register.html");
  if(user){
    ttl.textContent='Complete your class details'; hint.textContent='Logged in as '+user.email+'.'; go.textContent='Save details';
    document.querySelectorAll('.acct').forEach(x=>x.hidden=true);
    try{ const st=await rpc('hub_my_state'); if(st.profile){ fullname.value=st.profile.full_name; usn.value=st.profile.usn; sem.value=st.profile.semester; sec.value=st.profile.section; ttl.textContent='Update your details'; } }catch(e){}
  } else { email.required=p.required=q2.required=true; }
})();
f.onsubmit=async e=>{
  e.preventDefault();
  const prof={p_usn:usn.value.trim().toUpperCase(),p_name:fullname.value.trim(),p_semester:+sem.value,p_section:sec.value.trim().toUpperCase()};
  if(!/^4GW\d{2}EC\d{3}$/.test(prof.p_usn)) return msg(m,'USN must be in the format 4GWxxECxxx (ECE students only).','error');
  go.disabled=true;
  try{
    if(!user){
      if(p.value!==q2.value) throw new Error('Passwords do not match.');
      const {data,error}=await sb.auth.signUp({email:email.value.trim(),password:p.value,options:{data:{full_name:prof.p_name,usn:prof.p_usn}}});
      if(error) throw error;
      if(!data.session){
        localStorage.setItem('dviPendingProfile',JSON.stringify(prof));
        msg(m,'Account created. Please confirm your email using the link sent to you, then log in.','ok'); return;
      }
    }
    await rpc('hub_save_profile',prof);
    location='student.html';
  }catch(err){ msg(m,errText(err),'error'); go.disabled=false; }
};
</script></body></html>
